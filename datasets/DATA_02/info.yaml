dataset_id: DATA_02
description: "testing second time"
created_at: '2026-05-09T17:54:15.952961'

dataset_log_directory: "dataset_01/"

environment:
  location: craterHall            # options: MFH, craterHall, outdoor_field, simulation
  surface: sand                   # options: flat_floor, sand, crater
  terrain: loose                  # options: hard, loose
  slope_deg: 0                    # integer (e.g., 0, 5, 10)

motion:
  runtime_s: 200
  control: operator               # options: operator, autonomous
  velocity: medium                # options: low, medium, high, random
  trajectory: random              # options: random, straight_line, custom
  trajectory_description: ""      # fill only if trajectory = custom or random

sensors:
  imu:
    available: true
  encoders:
    available: true
  vicon:
    available: true
    copied_to_log_directory: true
  video:
    available: true
    copied_to_log_directory: true

data_quality:
  imu_sensor_data_available: true
  wheel_encoder_data_available: true
  vicon_data_available: true
  data_quality_issues: ""         # describe issues if any

events:
- type: slip
  start_s: 23                     # integer (time in seconds since the start of this experiment)
  end_s: 28                       # integer (time in seconds since the start of this experiment)         
  description: ""
- type: obstacle_climbing
  start_s: 78
  end_s: 89
  description: ""
